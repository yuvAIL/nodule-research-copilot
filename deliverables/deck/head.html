<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nodule Research Copilot — guided walkthrough for Daniel</title>
<link rel="stylesheet" href="deck.css">
<style>
  .s1-rows { display: flex; flex-direction: column; gap: 10px; }
  .s1-row { display: grid; grid-template-columns: 520px 1fr 150px; gap: 24px; align-items: center; }
  .s1-row .n { font-size: 24px; font-weight: 600; }
  .s1-row .n small { display: block; font-size: 17px; font-weight: 400; color: var(--muted); margin-top: 3px; }
  .s1-track { position: relative; height: 34px; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; }
  .s1-track i { position: absolute; top: 5px; bottom: 5px; border-radius: 6px; background: linear-gradient(90deg, rgba(92,200,242,.85), rgba(92,200,242,.45)); }
  .s1-track i.opt { background: repeating-linear-gradient(135deg, rgba(92,200,242,.55) 0 8px, rgba(92,200,242,.18) 8px 16px); }
  .s1-row .v { font: 600 22px/1 var(--mono); text-align: right; }
  .axis { display: grid; grid-template-columns: 520px 1fr 150px; gap: 24px; font: 15px/1 var(--mono); color: var(--dim); }
  .axis div.ticks { display: flex; justify-content: space-between; }
  .pill-row { display: flex; gap: 12px; flex-wrap: wrap; }
  .shotframe { flex: 1; min-height: 0; }
  .num-list { display: grid; grid-template-columns: auto 1fr; gap: 10px 18px; align-items: baseline; font-size: 21px; }
  .num-list .k { color: var(--muted); }
  .num-list .val { font-family: var(--mono); }
  .ba { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  .ba .shot { height: 560px; }
  .ba .shot img { object-position: top center; }
  .metric { display: flex; flex-direction: column; gap: 8px; }
  .metric .big { font-size: 64px; }
  .metric .label { font-size: 18px; }
  .chip-src { font: 600 13px/1 var(--mono); color: var(--dim); letter-spacing: .06em; text-transform: uppercase; }
  .q { display: grid; grid-template-columns: 54px 1fr; gap: 16px; align-items: start; font-size: 27px; line-height: 1.3; }
  .q .i { width: 54px; height: 54px; border-radius: 14px; display: grid; place-items: center; font: 700 24px/1 var(--mono); background: rgba(92,200,242,.1); border: 1px solid rgba(92,200,242,.4); color: var(--cyan); }
  blockquote { margin: 0; font-size: 25px; line-height: 1.42; color: var(--text); border-left: 3px solid var(--cyan); padding: 4px 0 4px 24px; }
  .pending { border: 1px dashed rgba(251,191,36,.5); background: rgba(251,191,36,.05); }
  .budget { position: relative; height: 54px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
  .budget i { position: absolute; top: 7px; bottom: 7px; border-radius: 8px; }
</style>
</head>
<body>
<!--SLIDES-->
</body>
</html>
